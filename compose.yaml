name: securevault-local

x-backend: &backend
  build: ./backend
  image: securevault-api:local
  environment:
    DATABASE_URL: postgresql+psycopg://securevault:${SECUREVAULT_DB_PASSWORD:?Generate .env.docker first}@db:5432/securevault
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate .env.docker first}
    VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?Generate .env.docker first}
    AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:?Generate .env.docker first}
    ENVIRONMENT: development
    ALLOWED_HOSTS: localhost,127.0.0.1
    CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    DOCS_ENABLED: "true"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env.docker first}
      SECUREVAULT_DB_PASSWORD: ${SECUREVAULT_DB_PASSWORD:?Generate .env.docker first}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-securevault.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${SECUREVAULT_HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
