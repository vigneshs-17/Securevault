name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: securevault_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      SECUREVAULT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/securevault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/check.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python backend/scripts/init_docker_env.py --domain ci.example.com
          docker compose -f compose.prod.yaml --env-file .env.prod config --quiet
          docker compose -f compose.prod.yaml --env-file .env.prod build
